name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify the tag matches manifest.version
        run: |
          version="$(jq -r '.version' print-the-shot.reaplugin/manifest.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest.version $version" >&2
            exit 1
          fi

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build the plugin bundle
        run: npm run build

      - name: Build the archive
        run: ./scripts/package.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/print-the-shot.reaplugin.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
